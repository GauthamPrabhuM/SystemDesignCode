name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (pytest + ruff)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sdc
          POSTGRES_PASSWORD: sdc
          POSTGRES_DB: sdc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sdc"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        working-directory: services/api
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx
      - name: Ruff
        working-directory: services/api
        run: ruff check .
      - name: Run migrations
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+asyncpg://sdc:sdc@localhost:5432/sdc
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-thats-long-enough
        run: alembic upgrade head
      - name: Pytest
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+asyncpg://sdc:sdc@localhost:5432/sdc
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-thats-long-enough
        run: pytest -q

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm install
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint --if-present
      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
        run: npm run build

  executor:
    name: Executor (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: services/executor
        run: pip install redis asyncpg anthropic ruff
      - name: Ruff
        working-directory: services/executor
        run: ruff check worker/

  docker-build:
    name: Docker build (sanity)
    runs-on: ubuntu-latest
    needs: [api, web, executor]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: false
          tags: sdc-api:ci
      - name: Build executor image
        uses: docker/build-push-action@v6
        with:
          context: services/executor
          push: false
          tags: sdc-executor:ci

name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/executor/**"
      - ".github/workflows/deploy-api.yml"

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API
        working-directory: services/api
        run: flyctl deploy --remote-only --config ../../infra/fly/api.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy Executor
        working-directory: services/executor
        run: flyctl deploy --remote-only --config ../../infra/fly/executor.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

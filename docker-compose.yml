# One-command local dev: `docker compose up`
# Brings up: Postgres, Redis, FastAPI API, executor worker, Next.js web

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdc
      POSTGRES_PASSWORD: sdc
      POSTGRES_DB: sdc
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://sdc:sdc@postgres:5432/sdc
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-change-me
      JWT_ALG: HS256
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    volumes:
      - ./services/api:/app
      - ./problems:/problems:ro
    command: >
      sh -c "export PYTHONPATH=/app &&
             alembic upgrade head &&
             python scripts/load_problems.py /problems &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  executor:
    build:
      context: ./services/executor
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://sdc:sdc@postgres:5432/sdc
      EXECUTOR_RUNTIME: docker         # docker | gvisor (runsc on host)
      SANDBOX_MEMORY: 256m
      SANDBOX_CPUS: "0.5"
      SANDBOX_TIMEOUT_S: "10"
    # The executor spawns sibling containers via the host docker socket.
    # Acceptable for local dev; production uses a remote docker daemon or k8s Jobs.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/executor:/app
      - /tmp:/tmp   # sibling containers bind-mount from this path; must match host

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports: ["3000:3000"]
    volumes:
      - ./apps/web:/app
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata: {}

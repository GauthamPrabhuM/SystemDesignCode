app = "sdc-api"
primary_region = "bom"   # Mumbai — change: sin=Singapore, lax=LA, lhr=London, iad=US-East

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep API warm; set true to save money if latency is OK
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"   # 256mb OOMs on alembic + uvicorn startup together

[deploy]
  release_command = "sh -c 'export PYTHONPATH=/app && alembic upgrade head && python scripts/load_problems.py /problems'"

app = "sdc-executor"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  EXECUTOR_RUNTIME = "docker"

# Workers are stateless. Auto-stop saves money when no jobs.
[http_service]
  internal_port = 9100   # placeholder healthcheck server
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"

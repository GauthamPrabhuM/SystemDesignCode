- name: basic_allow_within_limit
  kind: public
  weight: 2
  timeout_ms: 3000
  input:
    commands:
      - {op: init, rate: 3, window_ms: 1000}
      - {op: allow, user_id: alice, now_ms: 0}
      - {op: allow, user_id: alice, now_ms: 200}
      - {op: allow, user_id: alice, now_ms: 400}
  expected:
    responses:
      - {ok: true}
      - {allowed: true}
      - {allowed: true}
      - {allowed: true}

- name: rate_limited_on_4th_request
  kind: public
  weight: 2
  timeout_ms: 3000
  input:
    commands:
      - {op: init, rate: 3, window_ms: 1000}
      - {op: allow, user_id: alice, now_ms: 0}
      - {op: allow, user_id: alice, now_ms: 100}
      - {op: allow, user_id: alice, now_ms: 200}
      - {op: allow, user_id: alice, now_ms: 300}
  expected:
    responses:
      - {ok: true}
      - {allowed: true}
      - {allowed: true}
      - {allowed: true}
      - {allowed: false}

- name: window_slides_correctly
  kind: public
  weight: 3
  timeout_ms: 3000
  input:
    commands:
      - {op: init, rate: 2, window_ms: 1000}
      - {op: allow, user_id: bob, now_ms: 0}
      - {op: allow, user_id: bob, now_ms: 500}
      - {op: allow, user_id: bob, now_ms: 999}
      - {op: allow, user_id: bob, now_ms: 1001}
  expected:
    responses:
      - {ok: true}
      - {allowed: true}
      - {allowed: true}
      - {allowed: false}
      - {allowed: true}

- name: independent_users
  kind: public
  weight: 2
  timeout_ms: 3000
  input:
    commands:
      - {op: init, rate: 1, window_ms: 1000}
      - {op: allow, user_id: alice, now_ms: 0}
      - {op: allow, user_id: bob,   now_ms: 0}
      - {op: allow, user_id: alice, now_ms: 100}
  expected:
    responses:
      - {ok: true}
      - {allowed: true}
      - {allowed: true}
      - {allowed: false}

- name: usage_count
  kind: public
  weight: 2
  timeout_ms: 3000
  input:
    commands:
      - {op: init, rate: 5, window_ms: 1000}
      - {op: allow, user_id: alice, now_ms: 0}
      - {op: allow, user_id: alice, now_ms: 200}
      - {op: allow, user_id: alice, now_ms: 400}
      - {op: usage, user_id: alice, now_ms: 400}
  expected:
    responses:
      - {ok: true}
      - {allowed: true}
      - {allowed: true}
      - {allowed: true}
      - {count: 3}

- name: burst_then_sustained
  kind: hidden
  weight: 4
  timeout_ms: 5000
  input:
    commands:
      - {op: init, rate: 3, window_ms: 2000}
      - {op: allow, user_id: u1, now_ms: 0}
      - {op: allow, user_id: u1, now_ms: 10}
      - {op: allow, user_id: u1, now_ms: 20}
      - {op: allow, user_id: u1, now_ms: 30}
      - {op: allow, user_id: u1, now_ms: 2001}
      - {op: allow, user_id: u1, now_ms: 2011}
      - {op: allow, user_id: u1, now_ms: 2021}
      - {op: allow, user_id: u1, now_ms: 2031}
  expected:
    responses:
      - {ok: true}
      - {allowed: true}
      - {allowed: true}
      - {allowed: true}
      - {allowed: false}
      - {allowed: true}
      - {allowed: true}
      - {allowed: true}
      - {allowed: false}

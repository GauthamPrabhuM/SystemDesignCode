slug: splitwise
title: Design Splitwise (Expense Splitter)
difficulty: medium
category: machine-coding
time_limit_minutes: 75
is_premium: false

rubric:
  solid:
    - Single responsibility: balance calculation separate from expense storage
    - Liskov: different split strategies are interchangeable
  patterns:
    - Strategy for split types (equal, exact, percentage)
    - Observer to notify members of new expenses
  extensibility:
    - Easy to add new split types
    - Group and direct expenses unified under same model
  correctness:
    - Balances always sum to zero across all members
    - Settle correctly zeroes out a pair's balance

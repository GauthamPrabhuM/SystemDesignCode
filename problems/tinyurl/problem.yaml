slug: tinyurl
title: Design a URL Shortener
difficulty: medium
category: api-design
time_limit_minutes: 60
is_premium: false

rubric:
  solid:
    - Single responsibility: encoding logic separate from storage
    - Open/Closed: pluggable ID generation strategy
  patterns:
    - Strategy for ID generation (random, counter, hash)
    - Repository pattern for URL storage
  extensibility:
    - Custom aliases supported
    - Analytics (click counts) tracked
  correctness:
    - Collision handling for random IDs
    - Expired URLs return null
